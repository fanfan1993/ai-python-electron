[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "morrow-api"
version = "0.1.0"
description = "Morrow daily food, mood, and AI companion API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "langgraph>=0.2,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
